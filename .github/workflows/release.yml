name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (only used for manual runs)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.appversion.outputs.version }}
      build_number: ${{ steps.appversion.outputs.build_number }}
      tag: ${{ steps.appversion.outputs.tag }}
    steps:
      - name: Determine release tag and app version
        id: appversion
        shell: bash
        run: |
          # The release tag is the source of truth for the version: a pushed
          # "v*" git tag, or the manual "tag" input on workflow_dispatch.
          # Leave the input blank to fall back to auto-incrementing patch
          # version, starting at 1.0.0 on run #4 (this workflow's first 3
          # runs predate this scheme).
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW_TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          else
            PATCH=$(( ${{ github.run_number }} - 4 ))
            if [ "$PATCH" -lt 0 ]; then PATCH=0; fi
            RAW_TAG="1.0.$PATCH"
          fi

          VERSION_RAW="${RAW_TAG#v}"

          # Flutter's --build-name must be strictly numeric x.y.z, so derive
          # it from the leading numeric part of the tag. This lets the tag
          # itself carry a free-form suffix (e.g. "1.0.8f" for a corrected
          # re-release) without breaking the Flutter build.
          BUILD_NAME=$(echo "$VERSION_RAW" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$BUILD_NAME" ]; then
            echo "Could not derive a numeric x.y.z build-name from tag '$RAW_TAG'" >&2
            exit 1
          fi

          case "$RAW_TAG" in
            v*) TAG_NAME="$RAW_TAG" ;;
            *) TAG_NAME="v$RAW_TAG" ;;
          esac

          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building tag $TAG_NAME (Flutter build-name $BUILD_NAME, build-number ${{ github.run_number }})"

  build-android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.jks
          EOF

      - name: Build release APK
        run: >
          flutter build apk --release
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build_number }}

      - name: Build release App Bundle
        run: >
          flutter build appbundle --release
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build_number }}

      - name: Clean up signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: >
          flutter build windows --release
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build_number }}

      - name: Zip Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "soundscapes-windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: soundscapes-windows.zip
          if-no-files-found: error

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # libmpv-dev backs just_audio_media_kit's audio playback; the rest are
      # for the native runner (tray icon, GTK) — see linux/CMakeLists.txt.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libmpv-dev ninja-build

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: >
          flutter build linux --release
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build_number }}

      # tar, not zip: it preserves the executable permission bit on the
      # bundled binary, which zip doesn't reliably do (see
      # lib/services/update/linux_update_installer.dart).
      - name: Package Linux build
        run: |
          tar -czf soundscapes-linux.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: soundscapes-linux.tar.gz
          if-no-files-found: error

  release:
    needs: [version, build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: android-release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: windows-release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: linux-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            android-release/**/app-release.apk
            android-release/**/app-release.aab
            windows-release/soundscapes-windows.zip
            linux-release/soundscapes-linux.tar.gz
