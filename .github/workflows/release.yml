name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (only used for manual runs)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.appversion.outputs.version }}
      build_number: ${{ steps.appversion.outputs.build_number }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Compute app version
        id: appversion
        shell: bash
        run: |
          # Patch version increments once per workflow run, starting at 1.0.0
          # on run #4 (this workflow's first 3 runs predate this scheme).
          PATCH=$(( ${{ github.run_number }} - 4 ))
          if [ "$PATCH" -lt 0 ]; then PATCH=0; fi
          VERSION="1.0.$PATCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (build ${{ github.run_number }})"

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ steps.appversion.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.jks
          EOF

      - name: Build release APK
        run: >
          flutter build apk --release
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build_number }}

      - name: Build release App Bundle
        run: >
          flutter build appbundle --release
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build_number }}

      - name: Clean up signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: >
          flutter build windows --release
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build_number }}

      - name: Zip Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "soundscapes-windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: soundscapes-windows.zip
          if-no-files-found: error

  release:
    needs: [version, build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: android-release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: windows-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            android-release/app-release.apk
            android-release/app-release.aab
            windows-release/soundscapes-windows.zip
